<!DOCTYPE html>
<!-- El "DOCTYPE" significa literal lo que dice su nombre "Document type" y especifica que es un HTML, lo cual le va a servir a la computadora para saber que lo que va a ejecutar en este "lenguaje" en específico -->

<html lang="es">
<!-- Esta parte especifica el Lenguage del documento "en" - english y "es" - español -->
<head>
    <!-- este primer Head es el que se va a reflejar en el navegador o en la pestaña del navegador, NO en la PAGINA EN Sí-->
    <meta charset="UTF-8">
    <!-- Si no me equivoco esto significa el tipo de "acentos o símbolos que se van a usar" - esto para que pueda procesar acentos y otros símbolos que acompañan a las letras-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pagina de prueba </title>
    <!-- Este título es el que se ve en la barra de navegación-->
</head>
<body>
    <!-- Todo lo que contenga el Body ya es lo que se va a ver en tu página, por ende debes de construir todos los elementos de la página dentro de esta etiqueta, aquí usas las etiquetas como <h1>, <h2>, <p> -->
<h1> Pagina de prueba lección 11 del curso Platzi </h1>
<h2> Aquí pondré toda la información de prueba relacionada con esto </h2>
<p> Un primer punto que debemos de recordar es que la información aquí reflejada no tiene color, solo es la estructura del texto que va a contener </p>
</body>
</html>
